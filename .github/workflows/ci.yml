name: PR Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint source
        run: pnpm exec biome lint ./src

      - name: Test encryption, anime rotation, and incremental deployment
        run: pnpm test

      - name: Check Astro
        run: pnpm check

      - name: Build production site
        run: pnpm build

      - name: Install chat Worker dependencies
        run: pnpm --dir workers/live2d-chat install --frozen-lockfile

      - name: Check and test chat Worker
        run: |
          pnpm --dir workers/live2d-chat check
          pnpm --dir workers/live2d-chat test
          pnpm --dir workers/live2d-chat build

  ctf:
    name: CTF — 26-case campaign and Plasma desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers/ctf-game
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workers/ctf-game/pnpm-lock.yaml
      - name: Install CTF Worker dependencies
        run: pnpm install --frozen-lockfile
      - name: Check, test, and build CTF Worker
        run: |
          pnpm check
          pnpm test
          pnpm build
          pnpm runtimes:build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify compiled YesPlayMusic interface and profile storage
        run: YESPLAYMUSIC_BROWSER=1 node --test test/yesplaymusic-build.test.mjs
      - name: Test desktop and independently solve all 26 cases
        run: pnpm test:e2e
