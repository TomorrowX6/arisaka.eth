name: Cleanup Merged Branches

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  delete-merged-branch:
    name: Delete merged branch
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete merged branch
        uses: actions/github-script@v9
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          BRANCH_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const branch = process.env.BRANCH_NAME;
            const expectedSha = process.env.BRANCH_SHA;
            const { owner, repo } = context.repo;

            try {
              const current = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${branch}`,
              });

              if (current.data.object.sha !== expectedSha) {
                core.warning(
                  `Skipped ${branch}: branch moved after the pull request was merged.`,
                );
                return;
              }

              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`,
              });

              core.info(`Deleted merged branch: ${branch}`);
            } catch (error) {
              if (error.status === 404) {
                core.notice(`Branch already deleted: ${branch}`);
                return;
              }

              if (error.status === 422) {
                core.warning(
                  `GitHub refused to delete ${branch}; a branch rule may protect it.`,
                );
                return;
              }

              throw error;
            }
