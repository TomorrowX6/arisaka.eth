name: Deploy Permaweb

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "astro.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/permaweb.yml"

# Needed to push the refreshed upload cache back to the branch.
permissions:
  contents: write

# Never let two deploys race: they would each mint a manifest and fight over the
# ENS record, and the loser's upload would be paid for but never published.
concurrency:
  group: permaweb-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A queued run may have been triggered before the preceding deployment
      # committed its cache. Keep the source revision, but reuse its uploads.
      - name: Restore latest upload cache
        env:
          CACHE_BRANCH: ${{ github.ref_name }}
        run: node scripts/ci-permaweb-cache.mjs restore "$CACHE_BRANCH"

      - name: Write Arweave keyfile
        env:
          ARWEAVE_WALLET_JSON: ${{ secrets.ARWEAVE_WALLET_JSON }}
        run: |
          if [ -z "$ARWEAVE_WALLET_JSON" ]; then
            echo "::error::Secret ARWEAVE_WALLET_JSON is not set"
            exit 1
          fi
          printf '%s' "$ARWEAVE_WALLET_JSON" > wallet.json
          node -e 'const k=require("./wallet.json"); if(!k.n||!k.d) throw new Error("wallet.json is not an Arweave JWK"); console.log("keyfile ok")'

      - name: Build and deploy
        id: deploy
        env:
          DEPLOY_EVM_PRIVATE_KEY: ${{ secrets.DEPLOY_EVM_PRIVATE_KEY }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ENS_NAME: arisaka.eth
          BUILD_DIR: dist
          APP_NAME: arisaka-blog
        run: pnpm deploy:perma

      - name: Remove keyfile
        if: always()
        run: rm -f wallet.json

      # Retain a recovery copy even if pushing the permanent cache fails.
      - name: Preserve upload cache artifact
        if: ${{ always() && steps.deploy.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: permaweb-upload-cache-${{ github.run_id }}-${{ github.run_attempt }}
          path: .permaweb-cache.json
          include-hidden-files: true
          if-no-files-found: ignore

      # Merge into the latest branch in a temporary worktree. Only the cache is
      # committed, including after a partial upload; source commits are retained.
      # This path is excluded from the trigger, so the commit cannot redeploy.
      - name: Commit upload cache
        if: ${{ always() && steps.deploy.outcome != 'skipped' }}
        env:
          CACHE_BRANCH: ${{ github.ref_name }}
        run: node scripts/ci-permaweb-cache.mjs persist "$CACHE_BRANCH"
