name: Deploy Permaweb

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "astro.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"

# Needed to push the refreshed upload cache back to the branch.
permissions:
  contents: write

# Never let two deploys race: they would each mint a manifest and fight over the
# ENS record, and the loser's upload would be paid for but never published.
concurrency:
  group: permaweb-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write Arweave keyfile
        env:
          ARWEAVE_WALLET_JSON: ${{ secrets.ARWEAVE_WALLET_JSON }}
        run: |
          if [ -z "$ARWEAVE_WALLET_JSON" ]; then
            echo "::error::Secret ARWEAVE_WALLET_JSON is not set"
            exit 1
          fi
          printf '%s' "$ARWEAVE_WALLET_JSON" > wallet.json
          node -e 'const k=require("./wallet.json"); if(!k.n||!k.d) throw new Error("wallet.json is not an Arweave JWK"); console.log("keyfile ok")'

      - name: Build and deploy
        env:
          DEPLOY_EVM_PRIVATE_KEY: ${{ secrets.DEPLOY_EVM_PRIVATE_KEY }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ENS_NAME: arisaka.eth
          BUILD_DIR: dist
          APP_NAME: arisaka-blog
        run: pnpm deploy:perma

      - name: Remove keyfile
        if: always()
        run: rm -f wallet.json

      # Persist the map of content hashes to transaction IDs. Committed rather
      # than cached with actions/cache, whose entries expire after 7 days idle —
      # that would make every deploy after a quiet week pay to re-upload the
      # whole site. Runs even on failure so files already paid for are recorded.
      # This commit touches no path in the trigger filter above, so it cannot
      # retrigger the workflow.
      - name: Commit upload cache
        if: always()
        run: |
          if git diff --quiet -- .permaweb-cache.json; then
            echo "cache unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .permaweb-cache.json
          git commit -m "chore: update permaweb upload cache [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
