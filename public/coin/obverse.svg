<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480"
     role="img" aria-label="Arisaka.ETH CTF challenge coin — obverse">
  <title>Arisaka.ETH CTF Coin — Obverse</title>

  <!-- Metal palette. Override the m-hi / m-lt / m-mid / m-dk / m-dp custom properties
       from the host page to switch between gold, silver and bronze. -->
  <defs>
    <radialGradient id="o-face" cx="32%" cy="24%" r="82%">
      <stop offset="0%"   stop-color="var(--m-hi, #FBF0C4)"/>
      <stop offset="34%"  stop-color="var(--m-lt, #E3C566)"/>
      <stop offset="72%"  stop-color="var(--m-mid, #C39B2B)"/>
      <stop offset="100%" stop-color="var(--m-dk, #8A6614)"/>
    </radialGradient>

    <linearGradient id="o-edge" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%"   stop-color="var(--m-lt, #E3C566)"/>
      <stop offset="38%"  stop-color="var(--m-dk, #8A6614)"/>
      <stop offset="70%"  stop-color="var(--m-dp, #4A3406)"/>
      <stop offset="100%" stop-color="var(--m-dk, #8A6614)"/>
    </linearGradient>

    <linearGradient id="o-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="26%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="52%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="80%"  stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>

    <!-- Struck relief: specular highlight from the upper left + cast shadow to the lower right. -->
    <filter id="o-relief" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="b"/>
      <feSpecularLighting in="b" surfaceScale="2.4" specularConstant="0.85" specularExponent="17"
                          lighting-color="#ffffff" result="sp">
        <feDistantLight azimuth="228" elevation="56"/>
      </feSpecularLighting>
      <feComposite in="sp" in2="SourceAlpha" operator="in" result="spc"/>
      <feOffset in="SourceAlpha" dx="1.5" dy="1.7" result="off"/>
      <feFlood flood-color="#2a1c00" flood-opacity="0.5" result="dk"/>
      <feComposite in="dk" in2="off" operator="in" result="sh"/>
      <feComposite in="sh" in2="SourceAlpha" operator="out" result="shOut"/>
      <feMerge>
        <feMergeNode in="shOut"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="spc"/>
      </feMerge>
    </filter>

    <!-- Legend baselines: top reads over the crown, bottom reads across the exergue. -->
    <path id="o-arc-top"    d="M 47,240 A 193,193 0 0,1 433,240" fill="none"/>
    <path id="o-arc-bottom" d="M 47,240 A 193,193 0 0,0 433,240" fill="none"/>
  </defs>

  <!-- ── Planchet ───────────────────────────────────────────────── -->
  <circle cx="240" cy="240" r="238" fill="url(#o-edge)"/>

  <!-- Reeded edge: 132 teeth struck as a dashed annulus -->
  <circle cx="240" cy="240" r="228" fill="none" stroke="var(--m-lt, #E3C566)" stroke-width="20"
          stroke-dasharray="5 5.8528" opacity="0.5"/>
  <circle cx="240" cy="240" r="228" fill="none" stroke="var(--m-dp, #4A3406)" stroke-width="20"
          stroke-dasharray="1 9.8528" stroke-dashoffset="5" opacity="0.22"/>

  <!-- Raised field, seated with a hair of depth -->
  <circle cx="241" cy="243" r="217" fill="var(--m-dp, #4A3406)" opacity="0.55"/>
  <circle cx="240" cy="240" r="217" fill="url(#o-face)"/>

  <!-- ── Engraved rings ─────────────────────────────────────────── -->
  <g filter="url(#o-relief)">
    <circle cx="240" cy="240" r="211" fill="none" stroke="var(--m-dk, #8A6614)" stroke-width="1.6" opacity="0.75"/>
    <circle cx="240" cy="240" r="205" fill="none" stroke="var(--m-dk, #8A6614)" stroke-width="0.9" opacity="0.5"/>
    <!-- Bead circle, 96 beads -->
    <circle cx="240" cy="240" r="170" fill="none" stroke="var(--m-hi, #FBF0C4)" stroke-width="3.4"
            stroke-linecap="round" stroke-dasharray="0.01 11.126" opacity="0.9"/>
  </g>

  <!-- ── Legends ────────────────────────────────────────────────── -->
  <g filter="url(#o-relief)" fill="var(--m-hi, #FBF0C4)"
     font-family="Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="4.5">
    <text text-anchor="middle">
      <textPath href="#o-arc-top" startOffset="50%">CAPTURE THE FLAG</textPath>
    </text>
    <text text-anchor="middle">
      <textPath href="#o-arc-bottom" startOffset="50%">PROOF OF SOLVE</textPath>
    </text>
  </g>

  <!-- Rosette separators at 9 and 3 o'clock -->
  <g filter="url(#o-relief)" fill="var(--m-hi, #FBF0C4)">
    <path d="M 47,240 l 7,-8 7,8 -7,8 z"/>
    <path d="M 433,240 l -7,-8 -7,8 7,8 z"/>
  </g>

  <!-- ── Device: pennant flag crowned by the ETH octahedron ─────── -->
  <g filter="url(#o-relief)" transform="translate(240,196) scale(0.82) translate(-12,60)">
    <!-- octahedron finial: two facets parted by an engraved seam -->
    <path d="M -52,-152 -31,-114 -52,-102 -73,-114 z" fill="var(--m-hi, #FBF0C4)"/>
    <path d="M -73,-110 -52,-98 -31,-110 -52,-84 z" fill="var(--m-hi, #FBF0C4)"/>
    <!-- mast + plinth -->
    <path d="M -58,-92 -46,-92 -46,14 -58,14 z" fill="var(--m-hi, #FBF0C4)"/>
    <path d="M -76,14 -28,14 -32,26 -72,26 z" fill="var(--m-hi, #FBF0C4)"/>
    <!-- pennant: the seam tapers to the fly, reading as a fold in the cloth -->
    <path d="M -46,-78 100,-46 -46,-50 z" fill="var(--m-hi, #FBF0C4)"/>
    <path d="M -46,-43 100,-45 -46,-14 z" fill="var(--m-lt, #E3C566)"/>
  </g>

  <!-- ── Wordmark ───────────────────────────────────────────────── -->
  <g filter="url(#o-relief)">
    <text x="240" y="318" text-anchor="middle" textLength="252" lengthAdjust="spacingAndGlyphs"
          font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700"
          letter-spacing="1.5" fill="var(--m-hi, #FBF0C4)">ARISAKA<tspan
          font-size="28" font-weight="400" fill="var(--m-lt, #E3C566)">.ETH</tspan></text>
    <path d="M 168,336 h 144" stroke="var(--m-dk, #8A6614)" stroke-width="1.2" opacity="0.7"/>
    <text x="240" y="360" text-anchor="middle"
          font-family="'JetBrains Mono','SF Mono','Cascadia Mono',Consolas,monospace"
          font-size="13" letter-spacing="6" fill="var(--m-hi, #FBF0C4)" opacity="0.92">MMXXVI</text>
  </g>

  <!-- ── Specular sweep ─────────────────────────────────────────── -->
  <circle cx="240" cy="240" r="238" fill="url(#o-sheen)" style="pointer-events:none"/>
</svg>
