<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Arisaka.ETH favicon without flag">
  <title>Arisaka.ETH favicon</title>
  <defs>
    <linearGradient id="bg" x1="96" y1="72" x2="432" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.42" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(244 184) rotate(90) scale(220)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#c4b5fd" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ethTop" x1="188" y1="106" x2="324" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="ethBottom" x1="194" y1="258" x2="320" y2="406" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="facetLeft" x1="176" y1="174" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5f3ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ddd6fe" stop-opacity="0.78"/>
