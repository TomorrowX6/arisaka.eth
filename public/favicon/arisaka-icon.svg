  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#glow)"/>
  <rect x="44" y="44" width="424" height="424" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
  <rect x="56" y="56" width="400" height="400" rx="88" fill="none" stroke="#c4b5fd" stroke-opacity="0.18" stroke-width="1.5"/>

